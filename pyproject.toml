[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prowlarr2tx"
version = "0.1.0"
description = "Search Prowlarr on a schedule and send popular torrents to Transmission"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.31", "transmission-rpc>=7.0"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
prowlarr2tx = "prowlarr2tx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
